# Hospedagem própria: app + Postgres + Caddy com HTTPS automático.
# Uso: docker compose -f compose.prod.yaml --env-file .env up -d --build
# O compose.yaml continua sendo o do desenvolvimento (rede do Coolify e Traefik).
services:
  gerador-one:
    build:
      context: .
    image: gerador-one:2.0.0
    container_name: gerador-one
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://geradorone:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@db:5432/geradorone
      ADMIN_NAME: ${ADMIN_NAME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-}
      ALLOW_NEW_SECRET: ${ALLOW_NEW_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      BACKUP_ESPERADO: "1"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8123:3000"
    volumes:
      - ./runtime:/app/runtime
      - ./monitor:/app/monitor:ro
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web
      - internal

  db:
    image: postgres:17-alpine
    container_name: gerador-one-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: geradorone
      POSTGRES_DB: geradorone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geradorone -d geradorone"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - internal

  caddy:
    image: caddy:2-alpine
    container_name: gerador-one-caddy
    restart: unless-stopped
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    depends_on:
      - gerador-one
    networks:
      - web

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  web:
  internal:
    internal: true
